name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  swift:
    name: Swift build & test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: |
          swift build --product hangprobe
          swift build --product HangprobeApp

      - name: Test
        run: swift test

      - name: Device SDK export dry-run
        run: |
          DEST="$(mktemp -d)"
          scripts/export-oss.sh "${DEST}"
          rm -rf "${DEST}"

  oss-boundary:
    name: oss/ import wall
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Grep oss/ for core/app imports
        run: |
          if rg -n '^[[:space:]]*import HangprobeCore|^[[:space:]]*import HangprobeApp' oss/HangprobeKit oss/android; then
            echo "HangprobeCore/App import leaked into oss/" >&2
            exit 1
          fi
          echo "oss/ boundary clean"
