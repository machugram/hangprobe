[project]
name = "hangprobe"
version = "0.1.0"
description = "Sample a Mac or Simulator app's main thread and report a hang."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hangprobe = "hangprobe.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hangprobe*"]
